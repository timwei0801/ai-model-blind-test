<style>
  :root { --sidebar-w: 340px; --bg:#fff; --fg:#222; --muted:#777; --line:#e6e6e6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Hiragino Sans", "Microsoft JhengHei", sans-serif; color: var(--fg); }
  #app { display: flex; height: 100%; }
  #sidebar { width: var(--sidebar-w); flex: 0 0 var(--sidebar-w); overflow-y: auto; background: var(--bg); border-right: 1px solid var(--line); display:flex; flex-direction:column; }
  #map { flex: 1; min-width: 0; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; z-index: 5; }
  header h1 { font-size: 17px; margin: 0 0 4px; }
  header .sub { font-size: 12px; color: var(--muted); }
  .toolbar { display:flex; gap:6px; margin-top:10px; flex-wrap: wrap; }
  .toolbar button { font-size: 12px; padding: 5px 9px; border: 1px solid #ccc; background:#fafafa; border-radius: 6px; cursor:pointer; }
  .toolbar button:hover { background:#f0f0f0; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:#555; }
  .legend span { display:inline-flex; align-items:center; gap:4px; }
  .legend i { width:14px; height:14px; border-radius:50%; display:inline-block; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25); }
  #days { padding: 6px 0 20px; }
  .day { border-bottom: 1px solid var(--line); }
  .day-head { display:flex; align-items:center; gap:8px; padding: 9px 12px 9px 14px; cursor:pointer; user-select:none; }
  .day-head:hover { background:#f7f7f7; }
  .day.active .day-head { background:#f1f5ff; }
  .day-head input { margin:0; width:16px; height:16px; cursor:pointer; flex:0 0 auto; }
  .swatch { width:14px; height:14px; border-radius:3px; flex:0 0 auto; }
  .day-title { flex:1; min-width:0; }
  .day-title b { font-size:13.5px; }
  .day-title small { display:block; font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chev { color:#aaa; font-size:11px; transition: transform .15s; }
  .day.active .chev { transform: rotate(90deg); }
  .stops { display:none; padding: 0 10px 10px 14px; }
  .day.active .stops { display:block; }
  .stop { display:flex; gap:8px; align-items:flex-start; padding: 5px 6px; border-radius:6px; cursor:pointer; font-size:12.5px; line-height:1.35; }
  .stop:hover { background:#f3f3f3; }
  .stop .n { flex:0 0 20px; height:20px; border-radius:50%; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .stop .t { flex:0 0 58px; color:var(--muted); font-variant-numeric: tabular-nums; font-size:11.5px; margin-top:2px; }
  .stop .nm { flex:1; min-width:0; }
  .stop .nm small { display:block; color:#888; font-size:11px; }
  .hint { font-size:11px; color:#999; padding: 8px 16px 12px; line-height:1.5; }

  /* markers */
  .pin { width:30px; height:30px; border-radius:50% 50% 50% 0; transform: rotate(-45deg); border:2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; }
  .pin span { transform: rotate(45deg); font-size:15px; line-height:1; }
  .pin.alt { opacity:.75; border-style:dashed; }
  .pin-wrap { position:relative; }
  .pin-wrap.dim { opacity:.25; }
  .pin-wrap.sel { z-index: 1000 !important; }
  .num { position:absolute; left:20px; top:-10px; min-width:20px; height:20px; padding:0 5px; border-radius:10px; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.4); white-space:nowrap; }
  .leaflet-popup-content { font-size:13px; line-height:1.45; margin: 12px 14px; max-width: 280px; }
  .leaflet-popup-content h3 { font-size:14.5px; margin:0 0 4px; }
  .tag { display:inline-block; font-size:10.5px; padding:1px 6px; border-radius:4px; color:#fff; margin-right:4px; vertical-align:middle; }
  .approx { font-size:11px; color:#b35c00; background:#fff4e5; padding:2px 6px; border-radius:4px; display:inline-block; margin:3px 0; }
  .visit { margin:6px 0 0; padding:6px 0 0; border-top:1px dashed #ddd; }
  .visit .d { font-weight:700; }
  .visit .d i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .visit .tr { color:#666; font-size:12px; }
  .note { color:#444; font-size:12px; margin-top:4px; }
  .gmap { display:inline-block; margin-top:8px; font-size:12px; }
  .leaflet-tooltip.route-tip { font-weight:700; }

  #toggleSidebar { display:none; position:absolute; top:10px; right:10px; z-index:1001; background:#fff; border:1px solid #ccc; border-radius:6px; padding:6px 10px; font-size:13px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  @media (max-width: 760px) {
    #app { flex-direction: column; }

    #sidebar.collapsed { display:none; }
    #toggleSidebar { display:block; }
    #map { flex:1; }
  }
</style>

// ---------- 地圖 ----------
const map = L.map('map', {zoomControl:true});
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
const gsi = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>'
});
L.control.layers({'OpenStreetMap':osm, '国土地理院 淡色地圖（日文）':gsi}, null, {position:'topright'}).addTo(map);
L.control.scale({imperial:false}).addTo(map);

// 每個地點被哪些天造訪（供彈窗與編號用）
const visits = {}; // placeId -> [{dayIdx, order, stop}]
DAYS.forEach((day, di) => day.stops.forEach((s, si) => {
  (visits[s.p] = visits[s.p] || []).push({di, order: si+1, stop: s});
}));

function pinHtml(place, nums, color) {
  const T = TYPE[place.type];
  const alt = place.alt ? ' alt' : '';
  const badge = nums ? `<div class="num" style="background:${color}">${nums}</div>` : '';
  return `<div class="pin-wrap"><div class="pin${alt}" style="background:${T.color}"><span>${T.icon}</span></div>${badge}</div>`;
}
function makeIcon(place, nums, color) {
  return L.divIcon({html: pinHtml(place, nums, color), className:'', iconSize:[30,30], iconAnchor:[8,30], popupAnchor:[7,-30]});
}
function gmapLink(place) {
  const q = encodeURIComponent(place.name.replace(/（.*?）/g,'').trim() + ' ' + place.lat + ',' + place.lng);
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.lat + ',' + place.lng)}`;
}
function popupHtml(id) {
  const p = PLACES[id], T = TYPE[p.type];
  let h = `<h3>${p.name}</h3><span class="tag" style="background:${T.color}">${T.label}</span>`;
  if (p.alt) h += `<span class="tag" style="background:#999">備選</span>`;
  if (p.approx) h += `<div class="approx">⚠ 位置約略，請用 Google 地圖確認</div>`;
  if (p.note) h += `<div class="note">${p.note}</div>`;
  (visits[id] || []).forEach(v => {
    const d = DAYS[v.di];
    h += `<div class="visit"><div class="d"><i style="background:${d.color}"></i>${d.id} ${d.date}　${v.stop.t}　第 ${v.order} 站</div><div>${v.stop.d}</div>${v.stop.tr ? `<div class="tr">🚆 ${v.stop.tr}</div>` : ''}</div>`;
  });
  h += `<a class="gmap" target="_blank" rel="noopener" href="${gmapLink(p)}">在 Google 地圖開啟 ↗</a>`;
  return h;
}

const markers = {};  // placeId -> L.marker
const markerLayer = L.layerGroup().addTo(map);
Object.entries(PLACES).forEach(([id, p]) => {
  const m = L.marker([p.lat, p.lng], {icon: makeIcon(p, null, null), title: p.name, riseOnHover:true});
  m.bindPopup(() => popupHtml(id), {maxWidth: 320});
  markers[id] = m;
  m.addTo(markerLayer);
});

// 路線
const routes = DAYS.map((day) => {
  const latlngs = day.stops.map(s => [PLACES[s.p].lat, PLACES[s.p].lng]);
  const line = L.polyline(latlngs, {color: day.color, weight: 4, opacity: 0.85, lineJoin:'round'});
  line.bindTooltip(`${day.id} ${day.date}：${day.title}`, {sticky:true, className:'route-tip'});
  line.on('click', () => selectDay(DAYS.indexOf(day)));
  return line;
});

const state = { visible: DAYS.map(() => true), active: null };

function placesOfDay(di) { return new Set(DAYS[di].stops.map(s => s.p)); }

function refresh() {
  const shownPlaces = new Set();
  DAYS.forEach((day, di) => {
    if (state.visible[di]) { if (!map.hasLayer(routes[di])) routes[di].addTo(map); day.stops.forEach(s => shownPlaces.add(s.p)); }
    else if (map.hasLayer(routes[di])) map.removeLayer(routes[di]);
    const dimmed = state.active !== null && state.active !== di;
    routes[di].setStyle({opacity: dimmed ? 0.15 : 0.85, weight: state.active === di ? 6 : 4});
    if (state.active === di) routes[di].bringToFront();
  });
  // 備選地點：只在 D7 顯示時出現
  const d7 = DAYS.findIndex(d => d.id === 'D7');
  if (state.visible[d7]) { shownPlaces.add('midori'); shownPlaces.add('hanamaru'); }

  const activePlaces = state.active !== null ? placesOfDay(state.active) : null;
  Object.entries(markers).forEach(([id, m]) => {
    const p = PLACES[id];
    if (!shownPlaces.has(id)) { if (markerLayer.hasLayer(m)) markerLayer.removeLayer(m); return; }
    if (!markerLayer.hasLayer(m)) m.addTo(markerLayer);
    let nums = null, color = null, dim = false;
    if (activePlaces) {
      if (activePlaces.has(id)) {
        nums = visits[id].filter(v => v.di === state.active).map(v => v.order).join('·');
        color = DAYS[state.active].color;
      } else dim = true;
      if (state.active === d7 && p.alt) dim = false;
    }
    m.setIcon(makeIcon(p, nums, color));
    const el = m.getElement();
    if (el) { el.classList.toggle('dim', dim); el.style.zIndexOffset = ''; }
    m.setZIndexOffset(dim ? -500 : (nums ? 500 : 0));
    if (el) { const w = el.querySelector('.pin-wrap'); if (w) w.classList.toggle('dim', dim); }
  });
  document.querySelectorAll('.day').forEach((el, di) => el.classList.toggle('active', state.active === di));
}

function fitDay(di) {
  const b = routes[di].getBounds();
  if (b.isValid()) map.fitBounds(b.pad(0.2), {maxZoom: 15});
}
function fitAll() {
  const pts = [];
  DAYS.forEach((d, di) => { if (state.visible[di]) d.stops.forEach(s => pts.push([PLACES[s.p].lat, PLACES[s.p].lng])); });
  if (!pts.length) Object.values(PLACES).forEach(p => pts.push([p.lat, p.lng]));
  map.fitBounds(L.latLngBounds(pts).pad(0.08));
}
function selectDay(di, fit = true) {
  state.active = (state.active === di) ? null : di;
  if (state.active !== null) { state.visible[di] = true; document.querySelector(`#chk-${di}`).checked = true; }
  refresh();
  if (state.active !== null && fit) fitDay(di);
}

// ---------- 側欄 ----------
const daysEl = document.getElementById('days');
DAYS.forEach((day, di) => {
  const el = document.createElement('div');
  el.className = 'day';
  el.innerHTML = `
    <div class="day-head">
      <input type="checkbox" id="chk-${di}" checked title="顯示／隱藏這天">
      <span class="swatch" style="background:${day.color}"></span>
      <div class="day-title"><b>${day.id}　${day.date}</b><small>${day.title}</small></div>
      <span class="chev">▶</span>
    </div>
    <div class="stops">
      ${day.stops.map((s, si) => `
        <div class="stop" data-p="${s.p}">
          <span class="n" style="background:${day.color}">${si+1}</span>
          <span class="t">${s.t}</span>
          <span class="nm">${PLACES[s.p].name}<small>${s.d}${s.tr ? '　🚆 ' + s.tr : ''}</small></span>
        </div>`).join('')}
    </div>`;
  el.querySelector('.day-head').addEventListener('click', (e) => {
    if (e.target.tagName === 'INPUT') return;
    selectDay(di);
  });
  el.querySelector(`#chk-${di}`).addEventListener('change', (e) => {
    state.visible[di] = e.target.checked;
    if (!e.target.checked && state.active === di) state.active = null;
    refresh();
  });
  el.querySelectorAll('.stop').forEach(st => st.addEventListener('click', () => {
    const id = st.dataset.p, m = markers[id];
    if (state.active !== di) { state.active = di; state.visible[di] = true; document.querySelector(`#chk-${di}`).checked = true; refresh(); }
    map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 14), {duration: .6});
    setTimeout(() => m.openPopup(), 650);
    if (window.innerWidth <= 760) document.getElementById('sidebar').classList.add('collapsed');
  }));
  daysEl.appendChild(el);
});

document.getElementById('btnAll').onclick = () => { state.visible = DAYS.map(() => true); document.querySelectorAll('.day-head input').forEach(c => c.checked = true); refresh(); };
document.getElementById('btnNone').onclick = () => { state.visible = DAYS.map(() => false); state.active = null; document.querySelectorAll('.day-head input').forEach(c => c.checked = false); refresh(); };
document.getElementById('btnFit').onclick = () => { state.active = null; refresh(); fitAll(); };
document.getElementById('btnTokyo').onclick = () => { map.fitBounds([[35.62, 139.68],[35.73, 139.83]]); };
document.getElementById('toggleSidebar').onclick = () => document.getElementById('sidebar').classList.toggle('collapsed');

refresh();
fitAll();
</script>
