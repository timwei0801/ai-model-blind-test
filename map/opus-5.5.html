// ---------- 地圖 ----------
const map = L.map("map", { zoomControl: true });
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
}).addTo(map);

const gmaps = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const typeLabel = { sight: "景點", food: "餐廳", hotel: "飯店", transit: "車站" };

// 每個地點出現在哪幾天、哪幾個時段
const visits = {};
DAYS.forEach((day, di) => day.stops.forEach(s => {
  (visits[s.p] ||= []).push({ di, s });
}));

function popupHtml(id) {
  const p = P[id];
  const days = [...new Set(visits[id].map(v => v.di))];
  let h = `<div class="pop-h">${esc(p.name)}</div><div>`;
  days.forEach(di => h += `<span class="pop-d" style="background:${DAYS[di].color}">${DAYS[di].d} ${DAYS[di].date}</span>`);
  h += `</div>`;
  if (p.type !== "hotel") {
    visits[id].forEach(({ di, s }) => {
      h += `<div class="pop-row">${s.t ? `<b>${esc(s.t)}</b> ` : ""}${esc(s.text)}`;
      if (s.by) h += `<br><span style="color:#888">交通：${esc(s.by)}</span>`;
      h += `</div>`;
    });
  }
  if (p.note) h += `<div class="pop-row">${esc(p.note)}</div>`;
  h += `<a class="pop-gm" href="${gmaps(p.q)}" target="_blank" rel="noopener">在 Google 地圖開啟 ↗</a>`;
  return h;
}

// 建立圖釘：景點、餐廳依當天編號；飯店、車站共用一個
const markers = {};   // key -> { marker, type, days:Set }
const stopKey = {};   // `${di}-${si}` -> marker key

DAYS.forEach((day, di) => {
  let n = 0;
  day.stops.forEach((s, si) => {
    const p = P[s.p];
    const shared = p.type === "hotel" || p.type === "transit";
    const key = shared ? s.p : `${s.p}@${di}`;
    stopKey[`${di}-${si}`] = key;
    if (!shared) s.n = ++n;
    if (markers[key]) { markers[key].days.add(di); return; }

    let icon;
    if (p.type === "hotel") {
      icon = L.divIcon({ className: "", html: `<div class="pin-hotel">🏨</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
    } else if (p.type === "transit") {
      icon = L.divIcon({ className: "", html: `<div class="pin-transit"></div>`, iconSize: [12, 12], iconAnchor: [6, 6] });
    } else {
      icon = L.divIcon({ className: "", html: `<div class="pin ${p.type}${p.cand ? " cand" : ""}" style="background:${day.color}">${s.n}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
    }
    const m = L.marker(p.ll, { icon, zIndexOffset: p.type === "hotel" ? 1000 : p.type === "transit" ? -1000 : 0 })
      .bindPopup(() => popupHtml(s.p), { maxWidth: 300 })
      .bindTooltip(p.name, { direction: "top", offset: [0, -12] });
    markers[key] = { marker: m, type: p.type, days: new Set([di]) };
  });
});

// 每天的路線：步行實線、搭車虛線；候選餐廳不連線
const routes = DAYS.map(day => {
  const g = L.layerGroup();
  const path = day.stops.filter(s => !s.cand);
  for (let i = 1; i < path.length; i++) {
    const a = P[path[i - 1].p].ll, b = P[path[i].p].ll;
    L.polyline([a, b], {
      color: day.color, weight: 4, opacity: .85,
      dashArray: path[i].ride ? "8 7" : null,
    }).bindTooltip(`${day.d}：${path[i].by || ""}`, { sticky: true }).addTo(g);
  }
  return g;
});

// ---------- 狀態與顯示 ----------
let current = null;  // null = 全部
const typeOn = { sight: true, food: true, hotel: true, transit: true };

function render() {
  routes.forEach((g, di) => {
    const show = current === null || current === di;
    show ? g.addTo(map) : g.remove();
  });
  Object.values(markers).forEach(({ marker, type, days }) => {
    const show = typeOn[type] && (current === null || days.has(current));
    show ? marker.addTo(map) : marker.remove();
  });
  document.querySelectorAll("#days button").forEach(b => {
    const di = b.dataset.i === "all" ? null : +b.dataset.i;
    const on = di === current;
    b.classList.toggle("on", on);
    b.style.background = on ? (di === null ? "#333" : DAYS[di].color) : "#fff";
  });
  renderList();
}

function fitDay(di) {
  const lls = (di === null ? DAYS.flatMap(d => d.stops) : DAYS[di].stops).map(s => P[s.p].ll);
  map.fitBounds(L.latLngBounds(lls), { padding: [40, 40] });
}

function selectDay(di) {
  current = di;
  render();
  fitDay(di);
}

function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  DAYS.forEach((day, di) => {
    if (current !== null && current !== di) return;
    const h = document.createElement("div");
    h.className = "day-h";
    h.innerHTML = `<span class="bar" style="background:${day.color}"></span><span>${day.d} ${day.date}<br><small>${esc(day.title)}</small></span>`;
    h.onclick = () => selectDay(di);
    list.appendChild(h);
    if (day.note) {
      const n = document.createElement("div");
      n.className = "day-note";
      n.textContent = day.note;
      list.appendChild(n);
    }
    day.stops.forEach((s, si) => {
      const p = P[s.p];
      if (!typeOn[p.type]) return;
      const row = document.createElement("div");
      row.className = "stop";
      let ic;
      if (p.type === "hotel") ic = `<span class="ic hotel">🏨</span>`;
      else if (p.type === "transit") ic = `<span class="ic transit"></span>`;
      else ic = `<span class="ic${p.type === "food" ? " sq" : ""}" style="background:${day.color}">${s.n}</span>`;
      row.innerHTML = `<span class="t">${esc(s.t || "")}</span>${ic}<span><b>${esc(p.name)}</b> — ${esc(s.text)}${s.by ? `<span class="by">↳ ${esc(s.by)}</span>` : ""}</span>`;
      row.onclick = () => {
        const { marker } = markers[stopKey[`${di}-${si}`]];
        if (!map.hasLayer(marker)) marker.addTo(map);
        map.flyTo(p.ll, Math.max(map.getZoom(), 16), { duration: .6 });
        map.once("moveend", () => marker.openPopup());
      };
      list.appendChild(row);
    });
  });
}

// 天數按鈕
const daysEl = document.getElementById("days");
const allBtn = document.createElement("button");
allBtn.dataset.i = "all";
allBtn.textContent = "全部";
allBtn.onclick = () => selectDay(null);
daysEl.appendChild(allBtn);
DAYS.forEach((day, di) => {
  const b = document.createElement("button");
  b.dataset.i = di;
  b.innerHTML = `<span class="dot" style="background:${day.color}"></span>${day.d}`;
  b.title = `${day.date} ${day.title}`;
  b.onclick = () => selectDay(di);
  daysEl.appendChild(b);
});

document.querySelectorAll("#filters input").forEach(cb => {
  cb.onchange = () => { typeOn[cb.dataset.type] = cb.checked; render(); };
});

selectDay(null);
</script>
