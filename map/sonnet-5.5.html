<style>

  /* 側欄 */
  aside { display: flex; flex-direction: column; min-height: 0; background: #fff; border-right: 1px solid var(--line); }
  .head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .head h1 { margin: 0; font-size: 18px; }
  .head p { margin: 4px 0 0; font-size: 12px; color: var(--mute); }
  .tools { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; background: var(--bg); }

  .tools button { font: inherit; font-size: 12px; padding: 3px 9px; border: 1px solid #c8cfd7; background: #fff; border-radius: 999px; cursor: pointer; }
  .tools button:hover { background: #eef1f4; }
  .tools .sp { flex: 1; }
  #days { flex: 1; overflow-y: auto; padding: 8px 10px 20px; }

  .day { border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 8px; margin: 8px 0; background: #fff; }
  .day.sel { box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .dh { padding: 8px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .dh:hover { background: var(--bg); }
  .dh .d { font-weight: 700; color: var(--c); min-width: 26px; }
  .dh .t { font-size: 12.5px; line-height: 1.4; }
  .dh .t small { display: block; color: var(--mute); font-size: 12px; }
  .stops { display: none; list-style: none; margin: 0; padding: 2px 10px 10px; }
  .day.sel .stops { display: block; }
  .stop { display: flex; gap: 8px; padding: 6px 4px; border-top: 1px dashed var(--line); cursor: pointer; font-size: 13px; }
  .stop:hover { background: var(--bg); }
  .stop .no { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .stop .no.nb { background: #3d4a5c; font-size: 12px; }
  .stop .tm { color: var(--mute); font-size: 11.5px; }
  .stop .nm { font-weight: 600; }
  .stop .via { color: var(--mute); font-size: 11.5px; }
  .stop.todo { cursor: default; color: #8a6d00; background: #fffbea; }
  .stop.todo:hover { background: #fffbea; }
  .stop.todo .no { background: #e2c14c; }

  /* 地圖 */
  #map { height: 100%; width: 100%; }
  .legend { background: #fff; padding: 8px 10px; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.25); font-size: 12px; line-height: 1.7; }
  .legend i { display: inline-block; width: 18px; border-top: 3px solid #555; vertical-align: middle; margin-right: 6px; }
  .legend i.dash { border-top-style: dashed; }

  /* 圖釘 */
  .pin-wrap { background: none; border: 0; }
  .pin { position: relative; width: 32px; height: 32px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--c); border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,.4); }
  .pin .em { position: absolute; inset: 3px; border-radius: 50%; background: #fff; display: grid; place-items: center; transform: rotate(45deg); font-size: 14px; line-height: 1; }
  .pin .bd { position: absolute; top: -9px; right: -9px; transform: rotate(45deg); min-width: 17px; height: 17px; padding: 0 3px; border-radius: 9px; background: var(--c); color: #fff; border: 1.5px solid #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
  .pin.hotel { --c: #2d3748; }
  .pin.air { --c: #5f6b7a; }
  .arrow { background: none; border: 0; }
  .arrow b { display: block; width: 0; height: 0; border-left: 11px solid var(--c); border-top: 6px solid transparent; border-bottom: 6px solid transparent; filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff); }

  /* 彈窗 */
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.55; min-width: 220px; max-width: 290px; }
  .pp h3 { margin: 4px 0 2px; font-size: 15px; }
  .pp .chip { display: inline-block; color: #fff; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; margin: 0 4px 2px 0; background: var(--c); }
  .pp .kind { color: var(--mute); font-size: 12px; }
  .pp ul { margin: 6px 0; padding-left: 18px; }
  .pp .warn { color: #a15c00; font-size: 12px; margin-top: 4px; }
  .pp a { color: #1a6ed8; text-decoration: none; }
  .pp .tags span { display: inline-block; background: #f0f3f6; border-radius: 4px; padding: 0 6px; margin: 2px 4px 0 0; font-size: 12px; }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: 58% 42%; }
    #map { order: -1; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
    .legend { display: none; }
  }

/* ========== 預處理 ========== */
const KIND = { spot: ["🏯", "景點"], food: ["🍴", "餐廳"], hotel: ["🏨", "飯店"], air: ["✈️", "機場"] };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
DAYS.forEach(d => { let n = 0; d.stops.forEach(s => { const k = PLACES[s.p].k; s.n = (k === "hotel" || k === "air") ? null : ++n; }); });
const dayOf = id => DAYS.find(d => d.id === id);

/* ========== 地圖 ========== */
const map = L.map("map", { zoomControl: true });
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
const layer = L.layerGroup().addTo(map);
const arrowLayer = L.layerGroup().addTo(map);
const markers = {};            // key -> marker
let arrows = [];               // {a, b, color}
const state = { sel: null, types: { spot: true, food: true, hotel: true } };
const TOKYO = [[35.63, 139.68], [35.73, 139.83]];

// 兩點間畫一條微彎的線（往右偏），來回走同一路線時才不會疊在一起
function curve(a, b, k = 0.10) {
  const cx = Math.cos(((a[0] + b[0]) / 2) * Math.PI / 180);
  const ax = a[1] * cx, ay = a[0], bx = b[1] * cx, by = b[0];
  const dx = bx - ax, dy = by - ay;
  const mx = (ax + bx) / 2 + dy * k, my = (ay + by) / 2 - dx * k;   // 控制點
  const pts = [];
  for (let i = 0; i <= 24; i++) {
    const t = i / 24, u = 1 - t;
    pts.push([u * u * ay + 2 * u * t * my + t * t * by, (u * u * ax + 2 * u * t * mx + t * t * bx) / cx]);
  }
  return pts;
}
const distKm = (a, b) => {
  const R = 6371, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLon = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};

function pinIcon(kind, color, num) {
  const [em] = KIND[kind];
  const cls = kind === "hotel" ? "hotel" : kind === "air" ? "air" : "";
  return L.divIcon({
    className: "pin-wrap", iconSize: [32, 32], iconAnchor: [4, 34], popupAnchor: [12, -34],
    html: `<div class="pin ${cls}" style="--c:${color}"><div class="em">${em}</div>${num ? `<div class="bd">${num}</div>` : ""}</div>`,
  });
}

function gmap(p) { return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.q)}`; }

function popupHTML(pid, dayId, stop) {
  const p = PLACES[pid], [em, kn] = KIND[p.k];
  let h = `<div class="pp">`;
  if (p.k === "hotel" || p.k === "air") {
    h += `<div class="kind">${em} ${kn}</div><h3>${esc(p.n)}</h3>`;
    if (p.nights) h += `<div><b>住宿：</b>${esc(p.nights)}</div>`;
    if (p.info) h += `<ul>${p.info.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
    const uses = DAYS.filter(d => d.stops.some(s => s.p === pid));
    h += `<div>${uses.map(d => `<span class="chip" style="--c:${d.color}">D${d.id} ${d.date.split("（")[0]}</span>`).join("")}</div>`;
  } else {
    const d = dayOf(dayId);
    h += `<span class="chip" style="--c:${d.color}">D${d.id} ${esc(d.date)}</span><span class="chip" style="--c:#555">${esc(stop.t)}</span>`;
    h += `<h3>${em} ${esc(p.n)}</h3><div class="kind">${kn}</div>`;
    h += `<div>${esc(stop.act)}</div>`;
    if (stop.via) h += `<div>🚃 ${esc(stop.via)}</div>`;
    if (stop.note) h += `<div>📝 ${esc(stop.note)}</div>`;
    if (stop.m) h += `<div class="tags">${Object.entries(stop.m).map(([k, v]) => `<span>${esc(k)}：${esc(v)}</span>`).join("")}</div>`;
  }
  if (p.approx) h += `<div class="warn">📍 位置為概略，出發前請用 Google 地圖確認</div>`;
  h += `<div style="margin-top:6px"><a href="${gmap(p)}" target="_blank" rel="noopener">在 Google 地圖開啟 ↗</a></div></div>`;
  return h;
}

function render() {
  layer.clearLayers(); arrowLayer.clearLayers(); arrows = [];
  Object.keys(markers).forEach(k => delete markers[k]);
  const visible = state.sel ? [dayOf(state.sel)] : DAYS;
  const shared = new Set();

  visible.forEach(d => {
    // 路線
    for (let i = 1; i < d.stops.length; i++) {
      const A = PLACES[d.stops[i - 1].p], B = PLACES[d.stops[i].p];
      if (d.stops[i - 1].p === d.stops[i].p) continue;
      const long = distKm(A.ll, B.ll) > 15;
      const line = L.polyline(curve(A.ll, B.ll), { color: d.color, weight: state.sel ? 5 : 4, opacity: .85, dashArray: long ? "2 9" : null, lineCap: "round" }).addTo(layer);
      const tip = `D${d.id}：${A.n} → ${B.n}` + (d.stops[i].via ? `<br>🚃 ${esc(d.stops[i].via)}` : "");
      line.bindTooltip(tip, { sticky: true });
      arrows.push({ a: A.ll, b: B.ll, color: d.color });
    }
    // 圖釘（景點、餐廳）
    d.stops.forEach(s => {
      const p = PLACES[s.p];
      if (p.k === "hotel" || p.k === "air") { shared.add(s.p); return; }
      if (!state.types[p.k]) return;
      const m = L.marker(p.ll, { icon: pinIcon(p.k, d.color, s.n), title: p.n, riseOnHover: true }).addTo(layer);
      m.bindPopup(() => popupHTML(s.p, d.id, s));
      markers[`${d.id}:${s.p}`] = m;
    });
  });
  // 飯店、機場：多天共用，只放一支
  shared.forEach(pid => {
    const p = PLACES[pid];
    if (p.k === "hotel" && !state.types.hotel) return;
    const m = L.marker(p.ll, { icon: pinIcon(p.k, "#333", null), title: p.n, zIndexOffset: 500 }).addTo(layer);
    m.bindPopup(() => popupHTML(pid));
    markers[`h:${pid}`] = m;
  });
  drawArrows();
}

// 方向箭頭：放在每段線中點，依螢幕角度旋轉；縮放時重畫
function drawArrows() {
  arrowLayer.clearLayers();
  arrows.forEach(({ a, b, color }) => {
    const mid = curve(a, b)[12];
    const pa = map.latLngToContainerPoint(a), pb = map.latLngToContainerPoint(b);
    if (Math.hypot(pb.x - pa.x, pb.y - pa.y) < 36) return;
    const ang = Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI;
    L.marker(mid, { interactive: false, keyboard: false, icon: L.divIcon({
      className: "arrow", iconSize: [12, 12], iconAnchor: [6, 6],
      html: `<b style="--c:${color};transform:rotate(${ang}deg)"></b>` }) }).addTo(arrowLayer);
  });
}
map.on("zoomend", drawArrows);

function fit() {
  const pts = [];
  (state.sel ? [dayOf(state.sel)] : DAYS).forEach(d => {
    const core = d.stops.filter(s => !["hotel", "air"].includes(PLACES[s.p].k));
    // 飯店只在離當天景點不遠時才納入視角（D6 日光就不要把東京的飯店框進來）
    const near = s => core.some(c => distKm(PLACES[c.p].ll, PLACES[s.p].ll) < 30);
    (core.length >= 2 ? d.stops.filter(s => core.includes(s) || near(s)) : d.stops).forEach(s => pts.push(PLACES[s.p].ll));
  });
  if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 15 });
}

/* ========== 側欄 ========== */
function renderList() {
  const box = document.getElementById("days");
  box.innerHTML = DAYS.map(d => {
    const rows = d.stops.map((s, i) => {
      const p = PLACES[s.p], [em] = KIND[p.k];
      const no = s.n ? `<div class="no">${s.n}</div>` : `<div class="no nb">${em}</div>`;
      return `<li class="stop" data-d="${d.id}" data-i="${i}">${no}<div><div class="tm">${esc(s.t)}</div><div class="nm">${esc(p.n)}</div>${s.act !== p.n ? `<div class="via">${esc(s.act)}</div>` : ""}</div></li>`;
    }).join("");
    const todo = (d.todo || []).map(t => `<li class="stop todo"><div class="no">⏸</div><div><div class="tm">${esc(t.t)}（未放圖釘）</div><div class="via" style="color:inherit">${esc(t.act)}</div></div></li>`).join("");
    return `<div class="day ${state.sel === d.id ? "sel" : ""}" style="--c:${d.color}" data-id="${d.id}">
      <div class="dh"><span class="d">D${d.id}</span><span class="t">${esc(d.date)}<small>${esc(d.title)}</small></span></div>
      <ol class="stops">${rows}${todo}</ol></div>`;
  }).join("");
}

function select(id) {
  state.sel = id; renderList(); render(); fit();
  if (id) document.querySelector(`.day[data-id="${id}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

document.getElementById("days").addEventListener("click", e => {
  const row = e.target.closest(".stop");
  if (row && row.dataset.d) {
    const d = dayOf(+row.dataset.d), s = d.stops[+row.dataset.i], p = PLACES[s.p];
    const m = markers[`${d.id}:${s.p}`] || markers[`h:${s.p}`];
    map.setView(p.ll, Math.max(map.getZoom(), 14));
    if (m) m.openPopup();
    return;
  }
  const dh = e.target.closest(".dh");
  if (dh) { const id = +dh.parentElement.dataset.id; select(state.sel === id ? null : id); }
});
document.getElementById("btnAll").onclick = () => select(null);
document.getElementById("btnTokyo").onclick = () => map.fitBounds(TOKYO);
document.querySelectorAll("[data-type]").forEach(cb => cb.onchange = () => { state.types[cb.dataset.type] = cb.checked; render(); });

/* 圖例 */
const legend = L.control({ position: "bottomright" });
legend.onAdd = () => {
  const el = L.DomUtil.create("div", "legend");
  el.innerHTML = `<i></i>市區移動<br><i class="dash"></i>長程移動（&gt; 15 km，如東京↔箱根）<br>箭頭＝前進方向；圖釘上數字＝當天順序<br>深色圖釘＝飯店／機場`;
  return el;
};
legend.addTo(map);

map.fitBounds(TOKYO);   // 要先有視角，畫箭頭時才能換算螢幕座標
renderList(); render();
</script>
